# ------------------------------------------------------------------------------
# Destroyer Wordlist Generator - Configuration File
# ------------------------------------------------------------------------------
# This configuration file specifies default token pools, character sets,
# threshold limits, and network parameters used by DestroyerGenerator.
# Sections are parsed using configparser.ConfigParser(interpolation=None).
# ------------------------------------------------------------------------------

[years]
# 4-digit calendar years used for temporal suffixes and prefixes (1950 to 2030)
years = 1950,1951,1952,1953,1954,1955,1956,1957,1958,1959,1960,1961,1962,1963,1964,1965,1966,1967,1968,1969,1970,1971,1972,1973,1974,1975,1976,1977,1978,1979,1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026,2027,2028,2029,2030

# 2-digit year representations frequently appended by users
short_years = 24,25,26,27,28,29,30,95,96,97,98,99,00,01,02,03,04,05,06,07,08,09,10,11,12,15,20,21,22,23

[corporate_cycles]
# Temporal tokens common in corporate directory rotation policies
seasons = Spring,Summer,Autumn,Fall,Winter
quarters = Q1,Q2,Q3,Q4,H1,H2,FY24,FY25,FY26,FY27,FY28
months = January,February,March,April,May,June,July,August,September,October,November,December
short_months = Jan,Feb,Mar,Apr,May,Jun,Jul,Aug,Sep,Oct,Nov,Dec

[keyboard_walks]
# Contiguous keyboard sequences identified in breach analyses
walks = 123456,12345678,qweasd,asdfgh,zaq12wsx,!@#$,!@#$%^

[leet]
# Substitution mapping for character mutations
a = 4
i = 1
e = 3
t = 7
o = 0
s = 5
g = 9
z = 2
b = 8

[specialchars]
# ASCII punctuation characters used for prefix, delimiter, and suffix insertion
chars = !,@,#,$,%,&,*,-,_,=,+,?,~,<,>

[separators]
# Delimiter characters evaluated during multi-token passphrase generation
separators = -,_,.,@,#,$,!,&

[nums]
# Numeric range for sequential numeric suffixes in deep generation mode
from = 0
to = 100

[shaping]
# Global output candidate length filtering bounds
# wcfrom: Minimum length in characters (default: 8)
# wcto: Maximum length in characters (default: 64)
wcfrom = 8
wcto = 64

[nist]
# Minimum and maximum character bounds defined by NIST SP 800-63B Section 5.1.1.2
min_passphrase_length = 15
max_passphrase_length = 64

[scraper]
# Parameters for HTTP harvesting module
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36
timeout = 10
max_words = 60
min_word_len = 4
max_word_len = 22
